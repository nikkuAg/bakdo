<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2A1B5E"/><stop offset="0.55" stop-color="#1A1440"/><stop offset="1" stop-color="#0E0B26"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.36" cy="0.74" r="0.5">
    <stop offset="0" stop-color="#F6C657" stop-opacity="0.45"/><stop offset="1" stop-color="#F6C657" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF1C4"/><stop offset="0.5" stop-color="#F3C55E"/><stop offset="1" stop-color="#C98A24"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFE7A3"/><stop offset="0.6" stop-color="#F3C55E"/><stop offset="1" stop-color="#F3C55E" stop-opacity="0.15"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
  <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)" filter="url(#shadow)"/>
<g clip-path="url(#tile)">
  <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  <g fill="#FFFFFF">
    <circle cx="232" cy="236" r="5" opacity="0.8"/><circle cx="318" cy="168" r="3" opacity="0.6"/><circle cx="402" cy="262" r="4" opacity="0.7"/>
    <circle cx="190" cy="370" r="3" opacity="0.5"/><circle cx="780" cy="640" r="4" opacity="0.5"/><circle cx="860" cy="520" r="3" opacity="0.6"/>
    <circle cx="284" cy="470" r="2.5" opacity="0.5"/><circle cx="640" cy="196" r="3" opacity="0.5"/>
  </g>
  <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
</g>
<rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#F3C55E" stroke-opacity="0.35" stroke-width="3"/>
<!-- sparkle trail: a sound wave that settles into a line of writing -->
<path d="M268 742 C 300 690, 330 690, 352 742 C 374 800, 404 800, 428 742 C 448 700, 470 700, 490 742 C 506 772, 524 772, 540 742 L 742 742" fill="none" stroke="#F6C657" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#bloom)"/>
<path d="M268 742 C 300 690, 330 690, 352 742 C 374 800, 404 800, 428 742 C 448 700, 470 700, 490 742 C 506 772, 524 772, 540 742 L 742 742" fill="none" stroke="url(#trail)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<!-- quill, nib resting at the start of the trail -->
<g transform="rotate(38 512 512)" filter="url(#soft)">
  <path d="M520 186 C 640 300, 646 520, 566 690 L 528 752 L 506 752 C 438 560, 430 330, 520 186 Z" fill="url(#feather)"/>
  <path d="M520 186 C 470 300, 470 520, 516 752" fill="none" stroke="#A86D14" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#FFF6D8" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <line x1="508" y1="300" x2="556" y2="262"/><line x1="500" y1="380" x2="584" y2="318"/><line x1="498" y1="460" x2="596" y2="392"/>
    <line x1="500" y1="540" x2="590" y2="476"/><line x1="504" y1="616" x2="572" y2="566"/>
  </g>
  <path d="M506 752 L 528 752 L 520 846 Z" fill="#3A2A12"/>
</g>
<!-- sparkles -->
<g fill="#FFF3C8">
  <path d="M756 278 L 768 314 L 804 326 L 768 338 L 756 374 L 744 338 L 708 326 L 744 314Z"/>
  <path d="M812 690 L 820 712 L 842 720 L 820 728 L 812 750 L 804 728 L 782 720 L 804 712Z" opacity="0.9"/>
  <path d="M232 620 L 239 640 L 259 647 L 239 654 L 232 674 L 225 654 L 205 647 L 225 640Z" opacity="0.8"/>
</g>
</svg>
